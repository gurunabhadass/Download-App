name: Build AccessOne APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Access One.zip"
      - "logo.png"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract original website
        shell: bash
        run: |
          set -euo pipefail
          test -f "Access One.zip"
          mkdir -p website www
          unzip -o "Access One.zip" -d website
          INDEX_FILE="$(find website -type f -name index.html -print -quit)"
          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found inside Access One.zip"
            exit 1
          fi
          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"
          cp -R "$WEBSITE_ROOT"/. www/

          # Keep the supplied logo file unchanged. Use the ZIP copy only if
          # the same original logo has not also been uploaded at repository root.
          if [ ! -f logo.png ]; then
            test -f www/logo.png
            cp www/logo.png ./logo.png
          fi

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@latest @capacitor/android@latest @capacitor/app@latest @capacitor/status-bar@latest @capacitor/share@latest
          npm install --save-dev @capacitor/cli@latest esbuild
          npx cap init "AccessOne" "com.accessone.app" --web-dir www
          npx cap add android

      - name: Configure camera permission and normal Android screen
        shell: bash
        run: |
          set -euo pipefail

          # Declare CAMERA permission. Capacitor's BridgeWebChromeClient handles
          # the Android runtime permission prompt for WebView getUserMedia().
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          manifest_match = re.search(r'<manifest\b[^>]*>', text)
          if not manifest_match:
              raise SystemExit('ERROR: AndroidManifest.xml has no manifest tag')
          if 'android.permission.CAMERA' not in text:
              text = text[:manifest_match.end()] + '\n    <uses-permission android:name="android.permission.CAMERA" />' + text[manifest_match.end():]
          if 'android.hardware.camera.any' not in text:
              text = text.replace('</manifest>', '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n</manifest>')
          # Explicitly disable Android immersive/full-screen flags on the activity.
          text = re.sub(r'android:windowFullscreen="true"', 'android:windowFullscreen="false"', text)
          p.write_text(text, encoding='utf-8')
          PY

          # Force normal system-bar visibility at Activity startup as well.
          MAIN_JAVA="$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          if [ -z "$MAIN_JAVA" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi
          python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if 'WindowManager.LayoutParams.FLAG_FULLSCREEN' not in text:
              text = text.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport android.view.View;\nimport android.view.WindowManager;')
              text = text.replace('public class MainActivity extends BridgeActivity {', '''public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
              }''')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Add Android back-button handling without changing website source
        shell: bash
        run: |
          set -euo pipefail
          cat > native-support.js <<'JS'
          import { App } from '@capacitor/app';
          import { StatusBar } from '@capacitor/status-bar';

          const byId = (id) => document.getElementById(id);
          let lastBackAt = 0;
          let toastTimer;

          function toast(text) {
            let el = byId('accessone-native-back-toast');
            if (!el) {
              el = document.createElement('div');
              el.id = 'accessone-native-back-toast';
              el.style.cssText = 'position:fixed;z-index:2147483647;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#242424;color:#fff;padding:12px 18px;border-radius:24px;font:14px Arial,sans-serif;box-shadow:0 3px 14px #0005;white-space:nowrap;pointer-events:none;';
              document.body.appendChild(el);
            }
            el.textContent = text;
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.display = 'none'; }, 1900);
          }

          function isVisible(el) {
            if (!el) return false;
            return el.classList.contains('show') || el.classList.contains('open');
          }

          function handleBack() {
            // Close the app's header menu first.
            const menu = byId('menu');
            if (isVisible(menu)) {
              menu.classList.remove('open');
              return;
            }

            // Close the active face camera and stop its media stream.
            const camera = byId('cam');
            if (isVisible(camera)) {
              if (typeof window.closeCamera === 'function') window.closeCamera();
              else camera.classList.remove('show');
              return;
            }

            // Close image preview.
            const imageView = byId('imageView');
            if (isVisible(imageView)) {
              if (typeof window.closeImage === 'function') window.closeImage();
              else imageView.classList.remove('show');
              return;
            }

            // Close the top-most AccessOne dialog/popup.
            for (const id of ['pinModal', 'wizard', 'settings']) {
              const modal = byId(id);
              if (isVisible(modal)) {
                if (typeof window.hide === 'function') window.hide(id);
                else modal.classList.remove('show');
                return;
              }
            }

            // Any separate information page returns to the main Scan page.
            const page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
            if (page && page !== 'index.html') {
              location.replace('./index.html');
              return;
            }

            // From every other bottom tab, return to Scan.
            const activeSection = document.querySelector('main section.active');
            if (activeSection && activeSection.id !== 'scan') {
              if (typeof window.go === 'function') window.go('scan');
              lastBackAt = 0;
              return;
            }

            // On Scan, require two presses within two seconds to exit.
            const now = Date.now();
            if (now - lastBackAt <= 2000) {
              App.exitApp();
              return;
            }
            lastBackAt = now;
            toast('Press back again to exit');
          }

          document.addEventListener('DOMContentLoaded', async () => {
            // Keep Android status bar and navigation bar visible (not immersive).
            try { await StatusBar.setOverlaysWebView({ overlay: false }); } catch (_) {}
            try { await StatusBar.show(); } catch (_) {}
            try { await StatusBar.setBackgroundColor({ color: '#081322' }); } catch (_) {}
            try { if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen(); } catch (_) {}
            document.addEventListener('fullscreenchange', async () => {
              if (document.fullscreenElement && document.exitFullscreen) {
                try { await document.exitFullscreen(); } catch (_) {}
              }
            });
          }, { once: true });

          App.addListener('backButton', handleBack);
          JS

          npx esbuild native-support.js --bundle --format=iife --platform=browser --outfile=www/capacitor-native.js
          python3 - <<'PY'
          from pathlib import Path
          tag = '<script src="./capacitor-native.js"></script>'
          for p in Path('www').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              if 'capacitor-native.js' in text:
                  continue
              if '</body>' in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              else:
                  text += '\n' + tag
              p.write_text(text, encoding='utf-8')
          PY


      - name: Add native PDF Excel download and Android share support
        shell: bash
        run: |
          set -euo pipefail

          # Create a small native Android bridge that saves exported files into
          # the public Downloads/AccessOne folder on Android 10+, and app Downloads
          # on older Android versions.
          MAIN_JAVA="$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          test -n "$MAIN_JAVA"
          JAVA_DIR="$(dirname "$MAIN_JAVA")"
          PACKAGE_LINE="$(grep -m1 '^package ' "$MAIN_JAVA")"
          PACKAGE_NAME="${PACKAGE_LINE#package }"
          PACKAGE_NAME="${PACKAGE_NAME%;}"
          PLUGIN_JAVA="$JAVA_DIR/AccessOneFilesPlugin.java"

          cat > "$PLUGIN_JAVA" <<JAVA
          package $PACKAGE_NAME;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "AccessOneFiles")
          public class AccessOneFilesPlugin extends Plugin {
              @PluginMethod
              public void saveFile(PluginCall call) {
                  String fileName = call.getString("fileName");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  String base64Data = call.getString("base64Data");
                  if (fileName == null || fileName.trim().isEmpty() || base64Data == null) {
                      call.reject("Missing file name or file data");
                      return;
                  }
                  OutputStream output = null;
                  try {
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      Uri savedUri;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/AccessOne");
                          values.put(MediaStore.Downloads.IS_PENDING, 1);
                          Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new Exception("Could not create download file");
                          output = getContext().getContentResolver().openOutputStream(uri);
                          if (output == null) throw new Exception("Could not open download file");
                          output.write(bytes);
                          output.flush();
                          output.close();
                          output = null;
                          ContentValues done = new ContentValues();
                          done.put(MediaStore.Downloads.IS_PENDING, 0);
                          getContext().getContentResolver().update(uri, done, null, null);
                          savedUri = uri;
                      } else {
                          File dir = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (dir == null) throw new Exception("Downloads folder unavailable");
                          File folder = new File(dir, "AccessOne");
                          if (!folder.exists() && !folder.mkdirs()) throw new Exception("Could not create Downloads folder");
                          File file = new File(folder, fileName);
                          output = new FileOutputStream(file);
                          output.write(bytes);
                          output.flush();
                          output.close();
                          output = null;
                          savedUri = Uri.fromFile(file);
                      }
                      JSObject result = new JSObject();
                      result.put("fileName", fileName);
                      result.put("uri", savedUri.toString());
                      result.put("location", "Downloads/AccessOne");
                      call.resolve(result);
                  } catch (Exception e) {
                      try { if (output != null) output.close(); } catch (Exception ignored) {}
                      call.reject("Download failed: " + e.getMessage(), e);
                  }
              }
          }
          JAVA

          # Register the native file-saving plugin without changing other app behavior.
          python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if 'registerPlugin(AccessOneFilesPlugin.class)' not in text:
              text = text.replace('super.onCreate(savedInstanceState);', 'registerPlugin(AccessOneFilesPlugin.class);\n        super.onCreate(savedInstanceState);', 1)
          p.write_text(text, encoding='utf-8')
          PY

          # Override only the two existing browser fallback functions.
          cat > download-share.js <<'JS'
          import { registerPlugin } from '@capacitor/core';
          import { Share } from '@capacitor/share';

          const AccessOneFiles = registerPlugin('AccessOneFiles');
          window.fileDownload = async function (blob, name) {
            try {
              const ext = String(name || '').split('.').pop().toLowerCase();
              const mimeByExt = {
                pdf: 'application/pdf',
                xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                xls: 'application/vnd.ms-excel',
                json: 'application/json',
                csv: 'text/csv'
              };
              const mimeType = (blob && blob.type) || mimeByExt[ext] || 'application/octet-stream';
              const bytes = new Uint8Array(await blob.arrayBuffer());
              let binary = '';
              const chunkSize = 0x8000;
              for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
              }
              const base64Data = btoa(binary);
              await AccessOneFiles.saveFile({ fileName: name, mimeType, base64Data });
              if (typeof window.msg === 'function') window.msg('Saved to Downloads/AccessOne');
            } catch (error) {
              console.error('AccessOne file download failed:', error);
              if (typeof window.msg === 'function') window.msg('Download failed: ' + (error.message || 'Please try again'));
            }
          };

          window.shareApp = async function () {
            const appLink = 'https://gurunabhadass.github.io/Access_apk/';
            try {
              await Share.share({
                title: 'AccessOne',
                text: 'Download AccessOne - Smart Face Recognition & Access Control',
                url: appLink,
                dialogTitle: 'Share AccessOne'
              });
            } catch (error) {
              // User cancellation is normal; do not copy a link automatically.
              if (error && !String(error.message || '').toLowerCase().includes('cancel')) {
                console.error('AccessOne native share failed:', error);
                if (typeof window.msg === 'function') window.msg('Unable to open Android share panel');
              }
            }
          };
          JS

          npx esbuild download-share.js --bundle --format=iife --platform=browser --outfile=www/capacitor-download-share.js
          python3 - <<'PY'
          from pathlib import Path
          tag = '<script src="./capacitor-download-share.js"></script>'
          p = Path('www/index.html')
          text = p.read_text(encoding='utf-8')
          if 'capacitor-download-share.js' not in text:
              if '</body>' in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              else:
                  text += '\n' + tag
              p.write_text(text, encoding='utf-8')
          PY

      - name: Keep the supplied launcher logo unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -f logo.png
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp logo.png android/app/src/main/res/drawable-nodpi/access_one_logo.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          match = re.search(r'<application\b[^>]*>', text, re.DOTALL)
          if not match:
              raise SystemExit('ERROR: application tag not found')
          tag = match.group(0)
          tag = re.sub(r'\s+android:icon="[^"]*"', '', tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', '', tag)
          tag = tag[:-1] + ' android:icon="@drawable/access_one_logo">'
          text = text[:match.start()] + tag + text[match.end():]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AccessOne-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
